packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 supply-chain defaults (settings live here, NOT in .npmrc — pnpm 11)
engineStrict: true
minimumReleaseAge: 1440
blockExoticSubdeps: true

# pnpm 11 build-script allowlist. esbuild is required by Vitest; sharp by Next.js.
allowBuilds:
  esbuild: true
  sharp: true
