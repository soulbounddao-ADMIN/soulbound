<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D97757">
<title>오프라인 | SoulBound</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    background: #faf9f5;
    color: #191919;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 360px;
    padding: 28px 24px;
    border: 1px solid #e5e2d9;
    border-radius: 12px;
    background: #ffffff;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 500; }
  p { margin: 0 0 20px; color: #6b6862; font-size: 15px; }
  a {
    display: inline-block;
    min-height: 40px;
    padding: 0 18px;
    border-radius: 8px;
    background: #191919;
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
    line-height: 40px;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>오프라인 상태입니다</h1>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요. 연결이 없을 때는 개인 정보를 보여 주지 않습니다.</p>
  <a href="">다시 시도</a>
</main>
</body>
</html>
